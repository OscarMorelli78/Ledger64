precio unitario + transporte − descuento. Todos los importes son céntimos de euro, sin IVA.','Se excluyen líneas con discrepancias aritméticas y todas las líneas con un ID contradictorio. Las copias idénticas se señalan y solo se conserva la primera.','Se compara el mismo producto y unidad. Una subida de al menos 10 % frente a la compra anterior del mismo proveedor se señala, pero no se excluye por sí sola.','Se conserva la observación más reciente de cada proveedor en los 30 días anteriores a la última fecha elegible del escenario (inclusive).','Ahorro ilustrativo = cantidad de la última compra de cada producto × diferencia positiva entre su coste efectivo unitario y el menor coste efectivo de otro proveedor. No suma varias compras del mismo producto.','El informe descargable es un borrador sintético, no un informe aprobado. La autorización, la ingestión de documentos y ALE no están implementados en esta demo.'],products:{paper:'Papel A4',gloves:'Guantes',soap:'Jabón'}},en:{eyebrow:'Interactive demo / synthetic data',hero:'Learn from every invoice. Make every decision count.',intro:'Explore how Ledger64 helps review purchases, flag anomalies and compare supplier prices.',notice:'Standalone browser demonstration. Fictional data only. It does not run the Ledger64 Python engine or certify accounting results. Do not enter real data.',scenario:'Test scenario',issues:'Purchases with anomalies',clean:'Purchases without anomalies',run:'▶ Run audit',reset:'Reset',export:'Export JSON draft',auditTab:'01 / Audit',pricesTab:'02 / Comparison',methodTab:'03 / Methodology',cta:'Want to try the full project?',ctaText:'MIT open source. Try the local release with synthetic data and share feedback.',download:'View v0.1.0 ↗',feedback:'Send feedback ↗',footer:'Ledger64 · Promotional demo · No server, external AI or real data',ready:'Sample data loaded. Run the audit to calculate results.',done:'Audit complete. Results apply only to the fictional scenario.',rows:'Purchase lines',eligible:'Eligible amount',alerts:'Flags',savings:'Potential savings',draft:'Estimate, not realized savings',exVAT:'Excluding VAT',excluded:'excluded',invoice:'Invoice',date:'Date',supplier:'Supplier',product:'Product',qty:'Quantity',price:'€/unit',amount:'Amount',result:'Result',ok:'Valid',duplicate:'Potential duplicate (copy excluded)',math:'Amount mismatch',rise:'Price rise ≥10%',conflict:'Conflicting ID',all:'All lines',only:'Flagged only',empty:'No matching results.',before:'Run the audit first to calculate results.',comparisons:'Recent purchase comparison',latest:'Latest purchase',best:'Best observed alternative',potential:'Potential savings',noCompare:'No valid supplier comparisons.',method:'How this demo calculates results',rules:['Expected amount = quantity × unit price + shipping − discount. All monetary values are integer euro cents, excluding VAT.','Arithmetic mismatches and all rows with conflicting IDs are excluded. Identical copies are flagged and only the first is retained.','Compare identical product and unit. A rise of at least 10% against the previous purchase from the same supplier is flagged but not excluded on its own.','Use the most recent observation per supplier within 30 days of the latest eligible scenario date, inclusive.','Illustrative savings = latest purchase quantity for each product × positive difference between its effective unit cost and the lowest effective cost from another supplier. Does not sum multiple purchases of one product.','The downloadable report is a synthetic draft, not an approved report. Authorization, document ingestion and ALE are not implemented in this demo.'],products:{paper:'A4 paper',gloves:'Gloves',soap:'Soap'}}};
const row=(id,date,supplier,product,unit,qty,price,amount=qty*price,shipping=0,discount=0)=>({id,date,supplier,product,unit,qty,price,amount,shipping,discount});
function samples(s){const a=[row('D-101','2026-10-04','Atlas Demo','paper','ud',100,400),row('D-102','2026-10-05','Delta Demo','paper','ud',100,380),row('D-103','2026-10-12','Atlas Demo','paper','ud',150,s==='issues'?460:405),row('D-104','2026-10-06','Atlas Demo','gloves','ud',80,800),row('D-105','2026-10-10','Delta Demo','gloves','ud',100,720),row('D-106','2026-10-13','Atlas Demo','gloves','ud',120,800),row('D-107','2026-10-07','Costa Demo','soap','l',40,300),row('D-108','2026-10-14','Delta Demo','soap','l',40,280)];if(s==='issues'){a.push({...a[1]},row('D-109','2026-10-15','Costa Demo','soap','l',30,300,10500),row('D-110','2026-10-15','Atlas Demo','paper','ud',50,460),row('D-110','2026-10-15','Atlas Demo','paper','ud',50,480));}return a;}
function analyze(input){const groups=new Map();input.forEach((r,i)=>{if(!groups.has(r.id))groups.set(r.id,[]);groups.get(r.id).push({r,i})});const lines=input.map((r,i)=>({...r,i,flags:[],eligible:true}));for(const g of groups.values()){if(new Set(g.map(x=>JSON.stringify(x.r))).size>1){g.forEach(x=>{lines[x.i].flags.push('conflict');lines[x.i].eligible=false})}else if(g.length>1){g.slice(1).forEach(x=>{lines[x.i].flags.push('duplicate');lines[x.i].eligible=false})}}for(const l of lines){if(l.qty*l.price+l.shipping-l.discount!==l.amount){l.flags.push('math');l.eligible=false}}const valid=lines.filter(x=>x.eligible).sort((a,b)=>a.date.localeCompare(b.date)||a.i-b.i);const prev=new Map();for(const r of valid){const k=[r.product,r.unit,r.supplier].join('|');const p=prev.get(k);if(p&&r.price*100>=p.price*110)r.flags.push('rise');prev.set(k,r)}const cutoff=valid.length?Date.parse(valid.at(-1).date)-30*86400000:0;const recent=valid.filter(r=>Date.parse(r.date)>=cutoff);const grouped=new Map();for(const r of recent){const k=r.product+'|'+r.unit;if(!grouped.has(k))grouped.set(k,new Map());grouped.get(k).set(r.supplier,r)}const comparisons=[];for(const m of grouped.values()){const a=[...m.values()];if(a.length<2)continue;const latest=a.reduce((x,y)=>x.date>y.date||(x.date===y.date&&x.i>y.i)?x:y);const best=a.filter(x=>x.supplier!==latest.supplier).sort((x,y)=>x.amount*y.qty-y.amount*x.qty||x.supplier.localeCompare(y.supplier))[0];const saving=Math.max(0,Math.round((latest.amount*best.qty-best.amount*latest.qty)/best.qty));comparisons.push({latest,best,saving})}return {lines,comparisons,eligible:valid.reduce((a,r)=>a+r.amount,0),flags:lines.filter(r=>r.flags.length).length,excluded:lines.length-valid.length,savings:comparisons.reduce((a,r)=>a+r.saving,0)}}
let language='es',scenario='issues',tab='audit',result=null,filter=false;const $=s=>document.querySelector(s),t=k=>I[language][k],money=c=>new Intl.NumberFormat(language==='es'?'es-ES':'en-GB',{style:'currency',currency:'EUR'}).format(c/100),prod=k=>I[language].products[k];
function render(){document.documentElement.lang=language;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('#lang').textContent=language==='es'?'English':'Español';$('#status').textContent=t(result?'done':'ready');$('#export').disabled=!result;const vals=[[t('rows'),samples(scenario).length,result?`${result.excluded} ${t('excluded')}`:'',''],[t('eligible'),result?money(result.eligible):'—',t('exVAT'),''],[t('alerts'),result?result.flags:'—','','amber'],[t('savings'),result?money(result.savings):'—',t('draft'),'mint']];$('#kpis').innerHTML=vals.map(([a,b,c,d])=>`<div class="kpi"><small>${a}</small><strong class="${d}">${b}</strong><small>${c}</small></div>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));renderView()}
function renderView(){const v=$('#view');if(tab==='method'){v.innerHTML=`<h2>${t('method')}</h2><ol>${t('rules').map(x=>`<li>${x}</li>`).join('')}</ol>`;return}if(tab==='prices'){if(!result){v.textContent=t('before');return}v.innerHTML=`<h2>${t('comparisons')}</h2><div class="split">${result.comparisons.map(c=>{const a=c.latest,b=c.best,ap=a.amount/a.qty,bp=b.amount/b.qty,max=Math.max(ap,bp);return `<div class="callout"><h2>${prod(a.product)}</h2><p class="muted">${t('latest')} · ${a.date}</p><div class="barline"><span>${a.supplier}</span><b>${money(ap)} / ${a.unit}</b></div><div class="bar"><span style="width:${100*ap/max}%"></span></div><p class="muted">${t('best')} · ${b.date}</p><div class="barline"><span>${b.supplier}</span><b>${money(bp)} / ${b.unit}</b></div><div class="bar"><span style="width:${100*bp/max}%"></span></div><p>${t('potential')}: <strong class="mint">${money(c.saving)}</strong></p><small class="muted">${a.qty} ${a.unit} · ${t('draft')}</small></div>`}).join('')||t('noCompare')}</div>`;return}const data=result?result.lines:samples(scenario);const visible=data.filter(r=>!filter||!result||r.flags.length);v.innerHTML=`<div class="toolbar"><h2 class="grow">${t('auditTab')}</h2>${result?`<button id="filter" aria-pressed="${filter}">${filter?t('all'):t('only')}</button>`:''}</div><div class="tablewrap"><table><thead><tr>${['invoice','date','supplier','product','qty','price','amount','result'].map(k=>`<th scope="col">${t(k)}</th>`).join('')}</tr></thead><tbody>${visible.map(r=>`<tr><td>${r.id}</td><td>${r.date}</td><td>${r.supplier}</td><td>${prod(r.product)}</td><td class="num">${r.qty} ${r.unit}</td><td class="num">${money(r.price)}</td><td class="num">${money(r.amount)}</td><td>${!result?'—':r.flags.length?r.flags.map(f=>`<span class="tag ${r.eligible?'amber':'red'}">${t(f)}</span>`).join(' '):`<span class="mint">${t('ok')}</span>`}</td></tr>`).join('')||`<tr><td colspan="8">${t('empty')}</td></tr>`}</tbody></table></div>`;if($('#filter'))$('#filter').onclick=()=>{filter=!filter;renderView()}}
$('#audit').onclick=()=>{result=analyze(samples(scenario));render()};$('#reset').onclick=()=>{result=null;filter=false;tab='audit';scenario='issues';$('#scenario').value=scenario;render()};$('#scenario').onchange=e=>{scenario=e.target.value;result=null;filter=false;tab='audit';render()};$('#lang').onclick=()=>{language=language==='es'?'en':'es';render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#export').onclick=()=>{if(!result)return;const data={schema:'ledger64-browser-demo-v1',status:'synthetic_draft_not_approved',currency:'EUR',money_unit:'integer cents',scenario,...result};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ledger64-synthetic-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
