<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Ledger64 — Procurement simulation</title><style>
*{box-sizing:border-box}body{margin:0;background:#11162c;color:#eee;font:16px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px 20px}a{color:#92eacb}header{display:flex;justify-content:space-between;align-items:center;gap:12px}strong{font-family:monospace;font-size:23px}h1{font-size:clamp(25px,4vw,40px);line-height:1.15}p{color:#bfc8e3}#notice{border-left:3px solid #e8bd70;background:#20253e;padding:14px}#fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:grid;gap:5px;background:#1d2541;border:1px solid #354264;padding:12px;border-radius:8px}input,select,button{font:inherit;color:#fff;background:#252e4d;border:1px solid #667292;padding:8px;border-radius:5px;width:100%}select{width:auto}button{width:auto;cursor:pointer;margin-top:12px}button:hover,a:hover{color:#92eacb}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #92eacb;outline-offset:3px}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:20px 0}.result{padding:18px;border:1px solid #455273;border-radius:8px;background:#1d2541}.result b{display:block;font:700 28px monospace;margin-top:8px;overflow-wrap:anywhere}#exposure{color:#f7d28d}#error{color:#ffa3a3}footer{margin-top:24px;display:flex;gap:18px;flex-wrap:wrap}</style><script defer src="procurement.js"></script></head><body><main><header><strong>LEDGER64 · DEMO</strong><select id="lang" aria-label="Language"></select></header><h1 id="title"></h1><p id="notice"></p><div id="fields"></div><button id="reset" type="button"></button><p id="error" role="alert"></p><section class="results" aria-live="polite"><div class="result"><span id="billed-label"></span><b id="billed"></b></div><div class="result"><span id="expected-label"></span><b id="expected"></b></div><div class="result"><span id="exposure-label"></span><b id="exposure"></b></div></section><footer><a id="manual"></a><a id="home"></a><a href="https://github.com/OscarMorelli78/Ledger64/pull/2">PR #2</a><a href="https://github.com/OscarMorelli78/Ledger64/actions/runs/45889543410">CI</a></footer></main></body></html>
