services:
  app:
    build: .
    restart: unless-stopped
    environment:
      BC_ROOT: /data
      BC_TLS: '1'
      BC_HOSTS: '${BC_DOMAIN:?Set BC_DOMAIN}'
      BC_ORIGIN: 'https://${BC_DOMAIN}'
    volumes:
      - business_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
    networks: [backend]
    healthcheck:
      test: ['CMD','python','-c','import os,urllib.request; urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8765/login",headers={"Host":os.environ["BC_HOSTS"]}),timeout=3)']
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: traefik:v3.8.0
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:8080
      - --entrypoints.websecure.address=:8443
      - --entrypoints.web.http.redirections.entrypoint.to=:443
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=false
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --api=false
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    environment:
      BC_DOMAIN: '${BC_DOMAIN:?Set BC_DOMAIN}'
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: '${BC_ACME_EMAIL:-}'
    ports: ['80:8080','443:8443']
    volumes:
      - ./deploy/traefik.yml:/etc/traefik/dynamic.yml:ro
      - proxy_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    networks: [backend, edge]
    depends_on:
      app:
        condition: service_healthy
networks:
  backend:
    internal: true
  edge: {}
volumes:
  business_data: {}
  proxy_data: {}
