name: Procurement browser acceptance
on:
  pull_request:
    branches: [Main]
  push:
    branches: [feat/adaptive-procurement-v1]
    paths: ['procurement*.py','procurement*.html','procurement*.js','scripts/check_procurement_browser.py','.github/workflows/procurement-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa fonts-dejavu-core
      - run: python -m pip install -r requirements-dev.txt playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_procurement_browser.py
