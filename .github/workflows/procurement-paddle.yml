name: Procurement isolated Paddle table benchmark
on:
  push:
    branches: [feat/adaptive-procurement-v1]
    paths: ['.github/workflows/procurement-paddle.yml','scripts/benchmark_procurement_tables.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paddle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build separate CPU experiment (no customer data)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paddle-build" "$RUNNER_TEMP/paddle-report"
          cat > "$RUNNER_TEMP/paddle-build/Dockerfile" <<'EOF'
          FROM python:3.11-slim
          RUN apt-get update && apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1 fonts-dejavu-core && rm -rf /var/lib/apt/lists/*
          RUN python -m pip install --no-cache-dir paddlepaddle==3.2.0 && python -m pip install --no-cache-dir 'paddleocr[doc-parser]==3.3.1' 'paddlex[ocr]==3.3.6' && python -m pip check
          ENV HOME=/models PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True PYTHONDONTWRITEBYTECODE=1
          EOF
          docker build -t ledger64-paddle-experiment "$RUNNER_TEMP/paddle-build"
          docker run --rm ledger64-paddle-experiment python -m pip freeze > "$RUNNER_TEMP/paddle-report/dependencies.txt"
      - name: Provision models online (synthetic warmup only)
        run: |
          docker volume create ledger64-paddle-models
          docker run --rm --cap-drop ALL -v ledger64-paddle-models:/models -v "$GITHUB_WORKSPACE:/src:ro" -w /src ledger64-paddle-experiment python scripts/benchmark_procurement_tables.py provision --config /models/pipeline.yaml
      - name: Test real model with network disabled
        run: |
          chmod 755 "$RUNNER_TEMP/paddle-report"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges -v ledger64-paddle-models:/models -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/paddle-report:/report" -w /src ledger64-paddle-experiment python scripts/benchmark_procurement_tables.py evaluate --config /models/pipeline.yaml --output /report/tables.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: isolated-paddle-table-benchmark
          path: ${{ runner.temp }}/paddle-report
          if-no-files-found: warn
      - name: Cleanup model volume
        if: always()
        run: docker volume rm ledger64-paddle-models || true
