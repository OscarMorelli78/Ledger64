name: Synthetic learning acceptance
on: workflow_dispatch
permissions:
  contents: read
jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest adaptive_learning.test_learning
      - run: python -m adaptive_learning.stress --out /tmp/ale-1 --seed 20261126
      - run: python -m adaptive_learning.stress --out /tmp/ale-2 --seed 20261127
