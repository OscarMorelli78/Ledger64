name: Ledger64 project website
on:
  workflow_dispatch:
  push:
    branches: [Main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/site_metadata.py'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ledger64-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - name: Generate SEO metadata for the live project URL
        run: python scripts/site_metadata.py https://oscarmorelli78.github.io/Ledger64/
      - name: Stage public project documentation only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, shutil
          target = Path('_pages')
          target.mkdir()
          pages = ['index','es','fr','it','de','pt-BR','zh-CN','ja','hi']
          for name in pages:
              source = Path('site') / (name + '.html')
              text = source.read_text(encoding='utf-8')
              text = re.sub(r'<a\b[^>]*href="contact\.html"[^>]*>.*?</a>', '<a href="https://github.com/OscarMorelli78/Ledger64">GitHub</a>', text, flags=re.I|re.S)
              text = text.replace('</main>', '<p><a href="https://github.com/OscarMorelli78/Ledger64">Source code / MIT</a> | <a href="https://github.com/sponsors/OscarMorelli78">Support open-source development</a></p></main>')
              (target / source.name).write_text(text, encoding='utf-8')
          for name in ('style.css', 'robots.txt', 'sitemap.xml'):
              shutil.copyfile(Path('site') / name, target / name)
          # Accessible links while retaining the C64 palette.
          with (target / 'style.css').open('a', encoding='utf-8') as css:
              css.write('\na{color:#d8dcff;text-decoration:underline;text-underline-offset:.18em}a:visited{color:#e1c4ff}a:hover{color:#b9efaa}a:focus-visible{outline:2px solid #b9efaa;outline-offset:3px}nav{overflow-wrap:anywhere}\n')
          from xml.etree import ElementTree as ET
          sitemap = ET.parse(target / 'sitemap.xml')
          assert len(sitemap.findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url')) == 9
          for p in target.glob('*.html'):
              content = p.read_text(encoding='utf-8')
              assert 'noindex' not in content
              assert content.count('rel="canonical"') == 1
              assert content.count('hreflang=') == 10
          (target / '.nojekyll').touch()
          assert len(list(target.glob('*.html'))) == 9
          assert not any('contact.html' in p.read_text(encoding='utf-8') for p in target.glob('*.html'))
          # Google Search Console ownership verification (public file).
          (target / 'googledaf0135fdcc28f06.html').write_text('google-site-verification: googledaf0135fdcc28f06.html\n', encoding='utf-8')
          # Public IndexNow ownership file, scoped to this project path.
          (target / '5e49ee73b2be4d4fbebd52d6578186c6.txt').write_text('5e49ee73b2be4d4fbebd52d6578186c6', encoding='utf-8')
          PY
      - name: Identify new or changed public URLs
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, urllib.request, urllib.error
          base = 'https://oscarmorelli78.github.io/Ledger64/'
          key = '5e49ee73b2be4d4fbebd52d6578186c6'
          target = Path('_pages')
          def read_live(url):
              try:
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'Ledger64-Pages-CI/1.0'})
                  with urllib.request.urlopen(request, timeout=10) as response:
                      return response.read()
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise
          initial = read_live(base + key + '.txt') != key.encode()
          changed = []
          for name in ('index','es','fr','it','de','pt-BR','zh-CN','ja','hi'):
              file = target / (name + '.html')
              url = base if name == 'index' else base + file.name
              if initial or read_live(url) != file.read_bytes():
                  changed.append({'url': url, 'file': file.name})
          Path('_indexnow_changes.json').write_text(json.dumps(changed), encoding='utf-8')
          print(f'New or changed pages: {len(changed)}')
          PY
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Notify IndexNow after successful deployment
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, time, urllib.request, urllib.error
          base = 'https://oscarmorelli78.github.io/Ledger64/'
          key = '5e49ee73b2be4d4fbebd52d6578186c6'
          key_url = base + key + '.txt'
          manifest = Path('_indexnow_changes.json')
          if not manifest.exists():
              raise SystemExit('Change detection unavailable; no URLs submitted.')
          changed = json.loads(manifest.read_text(encoding='utf-8'))
          if not changed:
              print('No changed HTML pages; skipping IndexNow.')
              raise SystemExit(0)
          def live(url):
              req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'Ledger64-Pages-CI/1.0'})
              with urllib.request.urlopen(req, timeout=10) as response:
                  return response.read()
          for attempt in range(5):
              try:
                  if live(key_url).strip() == key.encode() and all(live(item['url']) == (Path('_pages') / item['file']).read_bytes() for item in changed):
                      break
              except (OSError, urllib.error.URLError):
                  pass
              if attempt < 4:
                  time.sleep(8)
          else:
              raise SystemExit('Published content not yet verified; no URLs submitted.')
          payload = {'host':'oscarmorelli78.github.io','key':key,'keyLocation':key_url,'urlList':[item['url'] for item in changed]}
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=json.dumps(payload).encode('utf-8'), headers={'Content-Type':'application/json; charset=utf-8','User-Agent':'Ledger64-Pages-CI/1.0'}, method='POST')
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status not in (200, 202):
                  raise SystemExit(f'Unexpected IndexNow response: {response.status}')
              print(f'IndexNow HTTP {response.status}: {len(changed)} URLs received; indexing is not guaranteed.')
          PY
