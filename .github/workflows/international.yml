name: International acceptance
on:
  workflow_dispatch:
  push:
    branches: [Main, main]
    paths: ["Dockerfile", "compose.yaml", "Caddyfile", "requirements*.txt", "**/*.py", "**/*.js", "**/*.cjs", "**/*.html", "locales/**", "smoke_container.sh", ".github/workflows/**"]
  pull_request:
    branches: [Main, main]
permissions:
  contents: read
jobs:
  international:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-core fonts-noto-cjk
      - run: python -m pip install -r requirements-dev.txt playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check.py
      - run: python scripts/browser_acceptance.py
